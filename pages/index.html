<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cloudflare D1과 연결된 Today's 하루 일정 관리 앱"
    />
    <title>Today's 하루</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
        --ink: #201d18;
        --muted: #746a5b;
        --green: #315542;
        --green-light: #dcebdc;
        --paper: rgb(255 255 255 / 92%);
        --line: rgb(71 57 39 / 15%);
        --shadow: 0 1.5rem 4rem rgb(37 29 19 / 22%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgb(245 241 232 / 72%), rgb(245 241 232 / 72%)),
          url("https://haru-todo-app.seotaiji0324.workers.dev/haru-library.png")
            center / cover fixed;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        width: min(70rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 1.25rem 0 3rem;
      }

      .topbar,
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-radius: 1.25rem;
      }

      .brand {
        margin: 0;
        color: #11110f;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: 850;
        letter-spacing: -0.05em;
      }

      .session {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .session-copy {
        display: none;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: right;
      }

      .session-copy strong {
        display: block;
        color: var(--ink);
        font-size: 1rem;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(19rem, 0.85fr);
        gap: 1.25rem;
        margin-top: 1.25rem;
      }

      .card {
        border-radius: 1.5rem;
      }

      .intro {
        min-height: 22rem;
        padding: clamp(2rem, 6vw, 4rem);
        background:
          linear-gradient(100deg, rgb(25 21 16 / 82%), rgb(25 21 16 / 24%)),
          url("https://haru-todo-app.seotaiji0324.workers.dev/haru-library.png")
            center / cover;
        color: white;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #dbe9d4;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .intro h2 {
        max-width: 12ch;
        margin: 0;
        font-family: Georgia, "Noto Serif KR", serif;
        font-size: clamp(2.4rem, 7vw, 4.8rem);
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      .intro p:last-child {
        max-width: 32rem;
        margin: 1.4rem 0 0;
        color: rgb(255 255 255 / 80%);
        line-height: 1.8;
      }

      .login {
        display: grid;
        align-content: center;
        padding: clamp(1.5rem, 5vw, 2.5rem);
      }

      .login h2,
      .tasks-title {
        margin: 0;
        font-size: 1.45rem;
        letter-spacing: -0.04em;
      }

      .login > p {
        margin: 0.65rem 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .field {
        display: grid;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
      }

      label {
        color: #554c40;
        font-size: 0.84rem;
        font-weight: 750;
      }

      input,
      select {
        width: 100%;
        min-height: 3rem;
        padding: 0.75rem 0.9rem;
        color: var(--ink);
        background: white;
        border: 1px solid #d8d0c3;
        border-radius: 0.8rem;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgb(49 85 66 / 13%);
      }

      .primary,
      .secondary,
      .edit,
      .danger,
      .filter {
        border: 0;
        border-radius: 999px;
        font-weight: 800;
      }

      .primary {
        min-height: 3rem;
        padding: 0.8rem 1.25rem;
        color: white;
        background: var(--green);
      }

      .login .primary {
        width: 100%;
        margin-top: 0.25rem;
      }

      .secondary {
        padding: 0.65rem 0.95rem;
        color: var(--green);
        background: var(--green-light);
      }

      .message {
        min-height: 1.35rem;
        margin: 0.8rem 0 0;
        color: #9e3b32;
        font-size: 0.88rem;
      }

      .admin-panel {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin: 1rem 0;
      }

      .admin-block {
        padding: 1rem;
        background: #f8f5ee;
        border: 1px solid var(--line);
        border-radius: 1rem;
      }

      .admin-block h3 {
        margin: 0;
        font-size: 1rem;
      }

      .admin-block > p {
        margin: 0.35rem 0 0.85rem;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.55;
      }

      .admin-form {
        display: grid;
        gap: 0.65rem;
      }

      .admin-form-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 7rem 7rem;
        gap: 0.55rem;
      }

      .admin-form-actions,
      .task-actions {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .admin-form .message {
        margin: 0;
      }

      .workspace {
        margin-top: 1.25rem;
        padding: clamp(1.25rem, 4vw, 2rem);
      }

      .workspace-head,
      .filters,
      .task-row,
      .task-main {
        display: flex;
        align-items: center;
      }

      .workspace-head {
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }

      .summary {
        margin: 0.3rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .task-form {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) 8rem 8rem auto;
        gap: 0.65rem;
        padding: 0.8rem;
        background: #f4f1ea;
        border: 1px solid var(--line);
        border-radius: 1rem;
      }

      .filters {
        gap: 0.45rem;
        margin: 1rem 0;
      }

      .filter {
        padding: 0.55rem 0.85rem;
        color: #655c50;
        background: transparent;
      }

      .filter.active {
        color: var(--green);
        background: var(--green-light);
      }

      .task-list {
        display: grid;
        gap: 0.65rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task-row {
        justify-content: space-between;
        gap: 1rem;
        min-height: 4.5rem;
        padding: 0.85rem 1rem;
        background: white;
        border: 1px solid var(--line);
        border-radius: 1rem;
      }

      .task-main {
        min-width: 0;
        gap: 0.9rem;
      }

      .task-main input {
        width: 1.15rem;
        min-height: auto;
        accent-color: var(--green);
      }

      .task-title {
        overflow-wrap: anywhere;
        font-weight: 750;
      }

      .task-row.completed .task-title {
        color: #8b8378;
        text-decoration: line-through;
      }

      .task-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.35rem;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .chip {
        padding: 0.15rem 0.5rem;
        color: var(--green);
        background: #edf5ea;
        border-radius: 999px;
        font-weight: 750;
      }

      .danger {
        flex: 0 0 auto;
        padding: 0.5rem 0.7rem;
        color: #9e3b32;
        background: #fff0ed;
      }

      .edit {
        flex: 0 0 auto;
        padding: 0.5rem 0.7rem;
        color: var(--green);
        background: var(--green-light);
      }

      .empty {
        padding: 3rem 1rem;
        color: var(--muted);
        text-align: center;
        background: rgb(255 255 255 / 55%);
        border: 1px dashed #cfc6b8;
        border-radius: 1rem;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 780px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .intro {
          min-height: 18rem;
        }

        .task-form {
          grid-template-columns: 1fr 1fr;
        }

        .task-form input:first-child,
        .task-form .primary {
          grid-column: 1 / -1;
        }

        .admin-panel {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 520px) {
        .shell {
          width: min(100% - 1rem, 70rem);
          padding-top: 0.5rem;
        }

        .session-copy {
          display: none !important;
        }

        .task-form {
          grid-template-columns: 1fr;
        }

        .task-form input:first-child,
        .task-form .primary {
          grid-column: auto;
        }

        .task-row {
          align-items: flex-start;
        }

        .admin-form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <h1 class="brand">Today's 하루</h1>
        <div class="session">
          <div class="session-copy" id="session-copy">
            좋은 하루예요
            <strong id="member-name"></strong>
          </div>
          <button class="secondary" id="logout" type="button" hidden>
            로그아웃
          </button>
        </div>
      </header>

      <main>
        <div class="hero" id="login-view">
          <section class="card intro">
            <p class="eyebrow">A quiet place for a focused day</p>
            <h2>오늘을 차분하게 정리하세요.</h2>
            <p>
              도서관의 고요함처럼 해야 할 일을 한눈에 정돈하고, 중요한
              하루에 집중하세요.
            </p>
          </section>

          <section class="card login">
            <h2>관리자 로그인</h2>
            <p>Cloudflare D1에 저장된 일정을 안전하게 관리합니다.</p>
            <form id="login-form">
              <div class="field">
                <label for="username">아이디</label>
                <input
                  id="username"
                  name="username"
                  value="seotaiji0324"
                  autocomplete="username"
                  required
                />
              </div>
              <div class="field">
                <label for="password">비밀번호</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
              </div>
              <button class="primary" type="submit">로그인</button>
              <p class="message" id="login-message" aria-live="polite"></p>
            </form>
          </section>
        </div>

        <section class="card workspace" id="workspace" hidden>
          <div class="workspace-head">
            <div>
              <h2 class="tasks-title">오늘 할 일</h2>
              <p class="summary" id="summary"></p>
            </div>
          </div>

          <form class="task-form" id="task-form">
            <input
              id="task-title"
              maxlength="120"
              placeholder="새로운 할 일을 입력하세요"
              aria-label="새로운 할 일"
              required
            />
            <select id="task-category" aria-label="카테고리">
              <option>개인</option>
              <option>업무</option>
              <option>건강</option>
              <option>공부</option>
            </select>
            <input id="task-time" type="time" aria-label="예정 시간" />
            <button class="primary" type="submit">일정 등록</button>
          </form>
          <p class="message" id="task-message" aria-live="polite"></p>

          <section class="admin-panel" id="admin-panel" aria-label="관리자 도구" hidden>
            <div class="admin-block">
              <h3>일정 수정</h3>
              <p id="edit-task-help">일정의 수정 버튼을 선택해 제목, 분류와 시간을 변경하세요.</p>
              <form class="admin-form" id="edit-task-form" hidden>
                <div class="admin-form-row">
                  <input
                    id="edit-task-title"
                    maxlength="120"
                    placeholder="일정명"
                    aria-label="수정할 일정명"
                    required
                  />
                  <select id="edit-task-category" aria-label="수정할 카테고리">
                    <option>개인</option>
                    <option>업무</option>
                    <option>건강</option>
                    <option>공부</option>
                  </select>
                  <input id="edit-task-time" type="time" aria-label="수정할 예정 시간" />
                </div>
                <div class="admin-form-actions">
                  <button class="primary" type="submit">수정 저장</button>
                  <button class="secondary" id="cancel-task-edit" type="button">취소</button>
                </div>
              </form>
            </div>

            <div class="admin-block">
              <h3>관리자 비밀번호 변경</h3>
              <p>현재 비밀번호를 확인한 뒤 12자 이상의 새 비밀번호로 변경합니다.</p>
              <form class="admin-form" id="password-form">
                <input
                  id="current-password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="현재 비밀번호"
                  aria-label="현재 비밀번호"
                  required
                />
                <input
                  id="new-password"
                  type="password"
                  autocomplete="new-password"
                  minlength="12"
                  maxlength="128"
                  placeholder="새 비밀번호"
                  aria-label="새 비밀번호"
                  required
                />
                <input
                  id="confirm-password"
                  type="password"
                  autocomplete="new-password"
                  minlength="12"
                  maxlength="128"
                  placeholder="새 비밀번호 확인"
                  aria-label="새 비밀번호 확인"
                  required
                />
                <button class="primary" type="submit">비밀번호 변경</button>
                <p class="message" id="password-message" aria-live="polite"></p>
              </form>
            </div>
          </section>

          <div class="filters" aria-label="일정 필터">
            <button class="filter active" data-filter="all" type="button">전체</button>
            <button class="filter" data-filter="open" type="button">할 일</button>
            <button class="filter" data-filter="completed" type="button">완료</button>
          </div>

          <ul class="task-list" id="task-list"></ul>
          <div class="empty" id="empty" hidden>표시할 일정이 없습니다.</div>
        </section>
      </main>
    </div>

    <script>
      const API_URL =
        "https://haru-todo-app.seotaiji0324.workers.dev/api/tasks";
      const PASSWORD_API_URL =
        "https://haru-todo-app.seotaiji0324.workers.dev/api/member-password";
      const SESSION_KEY = "haru-admin-basic";
      let credentials = sessionStorage.getItem(SESSION_KEY);
      let tasks = [];
      let member = null;
      let filter = "all";
      let editingTaskId = null;

      const loginView = document.querySelector("#login-view");
      const loginForm = document.querySelector("#login-form");
      const loginMessage = document.querySelector("#login-message");
      const workspace = document.querySelector("#workspace");
      const logoutButton = document.querySelector("#logout");
      const taskForm = document.querySelector("#task-form");
      const taskMessage = document.querySelector("#task-message");
      const taskList = document.querySelector("#task-list");
      const empty = document.querySelector("#empty");
      const adminPanel = document.querySelector("#admin-panel");
      const editTaskForm = document.querySelector("#edit-task-form");
      const editTaskHelp = document.querySelector("#edit-task-help");
      const passwordForm = document.querySelector("#password-form");
      const passwordMessage = document.querySelector("#password-message");

      function encodeCredentials(username, password) {
        const bytes = new TextEncoder().encode(`${username}:${password}`);
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      async function api(method = "GET", body) {
        const response = await fetch(API_URL, {
          method,
          headers: {
            Authorization: `Basic ${credentials}`,
            ...(body ? { "Content-Type": "application/json" } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(data.error || "요청을 처리하지 못했습니다.");
          error.status = response.status;
          throw error;
        }
        return data;
      }

      async function signIn(event) {
        event.preventDefault();
        loginMessage.textContent = "로그인 중입니다…";
        const form = new FormData(loginForm);
        credentials = encodeCredentials(
          String(form.get("username")),
          String(form.get("password")),
        );

        try {
          await loadTasks();
          sessionStorage.setItem(SESSION_KEY, credentials);
          loginForm.reset();
          document.querySelector("#username").value = "seotaiji0324";
          showWorkspace();
        } catch (error) {
          credentials = null;
          loginMessage.textContent =
            error.status === 401
              ? "아이디 또는 비밀번호가 올바르지 않습니다."
              : error.message;
        }
      }

      function signOut() {
        credentials = null;
        member = null;
        tasks = [];
        editingTaskId = null;
        sessionStorage.removeItem(SESSION_KEY);
        workspace.hidden = true;
        adminPanel.hidden = true;
        editTaskForm.hidden = true;
        editTaskHelp.hidden = false;
        passwordForm.reset();
        passwordMessage.textContent = "";
        loginView.hidden = false;
        logoutButton.hidden = true;
        document.querySelector("#session-copy").style.display = "none";
        loginMessage.textContent = "";
        document.querySelector("#password").focus();
      }

      async function loadTasks() {
        const data = await api();
        tasks = data.tasks;
        member = data.member;
        renderTasks();
      }

      function showWorkspace() {
        loginView.hidden = true;
        workspace.hidden = false;
        logoutButton.hidden = false;
        document.querySelector("#session-copy").style.display = "block";
        document.querySelector("#member-name").textContent =
          `${member.displayName}님.`;
        adminPanel.hidden = member.role !== "admin";
        taskMessage.textContent = "";
      }

      function renderTasks() {
        const visible = tasks.filter((task) => {
          if (filter === "open") return !task.completed;
          if (filter === "completed") return task.completed;
          return true;
        });
        const openCount = tasks.filter((task) => !task.completed).length;
        document.querySelector("#summary").textContent =
          `전체 ${tasks.length}개 · 남은 일정 ${openCount}개`;
        taskList.replaceChildren(...visible.map(createTaskRow));
        empty.hidden = visible.length > 0;
      }

      function createTaskRow(task) {
        const row = document.createElement("li");
        row.className = `task-row${task.completed ? " completed" : ""}`;

        const main = document.createElement("div");
        main.className = "task-main";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(task.completed);
        checkbox.setAttribute("aria-label", `${task.title} 완료 여부`);
        checkbox.addEventListener("change", () =>
          updateTask(task.id, checkbox.checked),
        );

        const copy = document.createElement("div");
        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.title;
        const meta = document.createElement("div");
        meta.className = "task-meta";
        const category = document.createElement("span");
        category.className = "chip";
        category.textContent = task.category;
        meta.append(category);
        if (task.dueTime) {
          const time = document.createElement("span");
          time.textContent = task.dueTime;
          meta.append(time);
        }
        copy.append(title, meta);
        main.append(checkbox, copy);
        row.append(main);

        if (member?.role === "admin") {
          const actions = document.createElement("div");
          actions.className = "task-actions";
          const edit = document.createElement("button");
          edit.className = "edit";
          edit.type = "button";
          edit.textContent = "수정";
          edit.setAttribute("aria-label", `${task.title} 수정`);
          edit.addEventListener("click", () => startTaskEdit(task));
          const remove = document.createElement("button");
          remove.className = "danger";
          remove.type = "button";
          remove.textContent = "삭제";
          remove.setAttribute("aria-label", `${task.title} 삭제`);
          remove.addEventListener("click", () => deleteTask(task.id));
          actions.append(edit, remove);
          row.append(actions);
        }
        return row;
      }

      async function addTask(event) {
        event.preventDefault();
        taskMessage.textContent = "등록 중입니다…";
        try {
          const result = await api("POST", {
            title: document.querySelector("#task-title").value,
            category: document.querySelector("#task-category").value,
            dueTime: document.querySelector("#task-time").value || null,
          });
          tasks.unshift(result.task);
          taskForm.reset();
          taskMessage.textContent = "일정이 클라우드 DB에 등록되었습니다.";
          renderTasks();
        } catch (error) {
          taskMessage.textContent = error.message;
        }
      }

      async function updateTask(id, completed) {
        taskMessage.textContent = "";
        try {
          const result = await api("PATCH", { id, completed });
          tasks = tasks.map((task) => (task.id === id ? result.task : task));
          renderTasks();
        } catch (error) {
          taskMessage.textContent = error.message;
          await loadTasks();
        }
      }

      function startTaskEdit(task) {
        editingTaskId = task.id;
        document.querySelector("#edit-task-title").value = task.title;
        document.querySelector("#edit-task-category").value = task.category;
        document.querySelector("#edit-task-time").value = task.dueTime || "";
        editTaskHelp.hidden = true;
        editTaskForm.hidden = false;
        document.querySelector("#edit-task-title").focus();
      }

      function cancelTaskEdit() {
        editingTaskId = null;
        editTaskForm.reset();
        editTaskForm.hidden = true;
        editTaskHelp.hidden = false;
      }

      async function saveTaskEdit(event) {
        event.preventDefault();
        if (!editingTaskId) return;

        taskMessage.textContent = "수정 중입니다…";
        try {
          const result = await api("PATCH", {
            id: editingTaskId,
            title: document.querySelector("#edit-task-title").value,
            category: document.querySelector("#edit-task-category").value,
            dueTime: document.querySelector("#edit-task-time").value || null,
          });
          tasks = tasks.map((task) =>
            task.id === editingTaskId ? result.task : task,
          );
          cancelTaskEdit();
          taskMessage.textContent = "일정을 수정했습니다.";
          renderTasks();
        } catch (error) {
          taskMessage.textContent = error.message;
        }
      }

      async function changePassword(event) {
        event.preventDefault();
        passwordMessage.textContent = "비밀번호를 변경하는 중입니다…";
        const currentPassword = document.querySelector("#current-password").value;
        const newPassword = document.querySelector("#new-password").value;
        const confirmPassword = document.querySelector("#confirm-password").value;

        if (newPassword !== confirmPassword) {
          passwordMessage.textContent = "새 비밀번호 확인이 일치하지 않습니다.";
          return;
        }

        const nextCredentials = encodeCredentials(member.username, newPassword);
        const currentCredentials = encodeCredentials(
          member.username,
          currentPassword,
        );

        try {
          const response = await fetch(PASSWORD_API_URL, {
            method: "PATCH",
            headers: {
              Authorization: `Basic ${currentCredentials}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ newPassword }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            const error = new Error(
              data.error || "비밀번호를 변경하지 못했습니다.",
            );
            error.status = response.status;
            throw error;
          }

          credentials = nextCredentials;
          sessionStorage.setItem(SESSION_KEY, credentials);
          passwordForm.reset();
          passwordMessage.textContent = "비밀번호가 변경되었습니다.";
        } catch (error) {
          passwordMessage.textContent = error.message;
        }
      }

      async function deleteTask(id) {
        if (!window.confirm("이 일정을 삭제할까요?")) return;
        taskMessage.textContent = "";
        try {
          await api("DELETE", { id });
          tasks = tasks.filter((task) => task.id !== id);
          taskMessage.textContent = "일정을 삭제했습니다.";
          renderTasks();
        } catch (error) {
          taskMessage.textContent = error.message;
        }
      }

      loginForm.addEventListener("submit", signIn);
      logoutButton.addEventListener("click", signOut);
      taskForm.addEventListener("submit", addTask);
      editTaskForm.addEventListener("submit", saveTaskEdit);
      document
        .querySelector("#cancel-task-edit")
        .addEventListener("click", cancelTaskEdit);
      passwordForm.addEventListener("submit", changePassword);
      document.querySelectorAll(".filter").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document.querySelectorAll(".filter").forEach((item) =>
            item.classList.toggle("active", item === button),
          );
          renderTasks();
        });
      });

      if (credentials) {
        loadTasks()
          .then(showWorkspace)
          .catch(signOut);
      }
    </script>
  </body>
</html>
