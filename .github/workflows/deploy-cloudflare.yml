name: Deploy Todo app to Cloudflare

on:
  push:
    branches:
      - codex/library-todo-cloudflare
      - codex/github-pages-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-todo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm test

      - name: Apply D1 task date migration when needed
        shell: bash
        run: |
          npx wrangler d1 execute Todo-project --remote --command "PRAGMA table_info(tasks)" --json --config dist/server/wrangler.json > d1-schema.json
          if ! jq -e '.[0].results | any(.name == "due_date")' d1-schema.json > /dev/null; then
            npx wrangler d1 execute Todo-project --remote --file drizzle/0003_add_task_due_date.sql --config dist/server/wrangler.json
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
